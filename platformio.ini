; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps = 
	milesburton/DallasTemperature @ ^3.11.0
	paulstoffregen/OneWire @ ^2.3.7
	knolleary/PubSubClient @ ^2.8
	https://github.com/avishorp/TM1637.git
build_flags =
    -D WIFI_SSID=${secrets.wifi_ssid}
    -D WIFI_PASS=${secrets.wifi_pass}
    -D MQTT_SERVER=${secrets.mqtt_broker}
    -D OTA_PASSWORD=${secrets.ota_auth}
    
; Forzar subida por red
;upload_protocol = espota
; Podés poner la IP directa del ESP32 o el mDNS (esp32-fermentador.local)
;upload_port = 192.168.100.25
; La contraseña de hardening que le seteamos al código
;upload_flags =
    ;--auth=FierroOTA2026
