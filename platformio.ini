; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini
default_envs = esp32-dry-run

[env]
platform = espressif32 @ 7.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Velocidad conservadora durante la validación del enlace USB y alimentación.
upload_speed = 115200
lib_deps =
	milesburton/DallasTemperature @ ^3.11.0
	paulstoffregen/OneWire @ ^2.3.7
	knolleary/PubSubClient @ ^2.8
	https://github.com/avishorp/TM1637.git
build_flags =
    -D WIFI_SSID=${secrets.wifi_ssid}
    -D WIFI_PASS=${secrets.wifi_pass}
    -D MQTT_SERVER=${secrets.mqtt_broker}
    -D OTA_PASSWORD=${secrets.ota_auth}

; Entorno histórico: salida física habilitada, consignas remotas/OTA deshabilitadas.
[env:esp32doit-devkit-v1]
build_flags =
    ${env.build_flags}
    -D DRY_RUN=0
    -D ACCEPT_MQTT_SETPOINTS=0
    -D ENABLE_OTA=0

[env:esp32-dry-run]
build_flags =
    ${env.build_flags}
    -D DRY_RUN=1
    -D ACCEPT_MQTT_SETPOINTS=0
    -D ENABLE_OTA=0

; Solo pruebas remotas controladas: nunca usar con perfiles automáticos activos.
[env:esp32-mqtt-test]
build_flags =
    ${env.build_flags}
    -D DRY_RUN=1
    -D ACCEPT_MQTT_SETPOINTS=1
    -D ENABLE_OTA=0

[env:esp32-ota-test]
build_flags =
    ${env.build_flags}
    -D DRY_RUN=1
    -D ACCEPT_MQTT_SETPOINTS=0
    -D ENABLE_OTA=1
